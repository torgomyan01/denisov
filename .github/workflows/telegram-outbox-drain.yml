# Wake Vercel gateway drain every minute (VPS cannot reach Telegram/Vercel TLS).
name: Telegram outbox drain

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: POST gateway /api/telegram/drain
        env:
          TELEGRAM_GATEWAY_URL: ${{ secrets.TELEGRAM_GATEWAY_URL }}
          TELEGRAM_GATEWAY_SECRET: ${{ secrets.TELEGRAM_GATEWAY_SECRET }}
        run: |
          set -e
          if [ -z "$TELEGRAM_GATEWAY_URL" ] || [ -z "$TELEGRAM_GATEWAY_SECRET" ]; then
            echo "Set repo secrets TELEGRAM_GATEWAY_URL and TELEGRAM_GATEWAY_SECRET"
            exit 0
          fi
          url="${TELEGRAM_GATEWAY_URL%/}/api/telegram/drain"
          for i in 1 2 3 4; do
            code=$(curl -sS -o /tmp/drain.json -w "%{http_code}" -X POST "$url" \
              -H "Authorization: Bearer $TELEGRAM_GATEWAY_SECRET" \
              -H "Content-Type: application/json" \
              -d '{}' || true)
            echo "attempt $i → HTTP $code"
            cat /tmp/drain.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep $((i * 2))
          done
          exit 1
