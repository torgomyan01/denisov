# Drain Telegram outbox from GitHub (VPS cannot reach Telegram/Vercel TLS).
# Uses existing gateway /send — no BotFather token in GitHub secrets.
name: Telegram outbox drain

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Drain outbox via gateway /send
        env:
          SITE_URL: https://cafedenisov.ru
          TELEGRAM_GATEWAY_URL: ${{ secrets.TELEGRAM_GATEWAY_URL }}
          TELEGRAM_GATEWAY_SECRET: ${{ secrets.TELEGRAM_GATEWAY_SECRET }}
        run: |
          if [ -z "$TELEGRAM_GATEWAY_URL" ] || [ -z "$TELEGRAM_GATEWAY_SECRET" ]; then
            echo "Set repo secrets TELEGRAM_GATEWAY_URL and TELEGRAM_GATEWAY_SECRET"
            exit 0
          fi
          node scripts/drain-telegram-outbox.mjs
